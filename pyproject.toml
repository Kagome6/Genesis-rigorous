[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis-rigorous"
version = "1.1.0"
description = "Unconstrained, U(N) gauge-invariant PyTorch/CUDA numerical framework for emergent geometry, entanglement area laws, matter couplings, random-law ecosystems, and non-perturbative matrix bootstrap in MQM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "psutil>=5.9",
]

[project.scripts]
genesis-rigorous = "genesis_cli:main"

[tool.setuptools]
py-modules = ["genesis_cli"]

[tool.setuptools.packages.find]
include = ["genesis_rigorous*"]
